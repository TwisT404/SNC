<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste des prestataires</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/layout/navbar.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/common.css}">
</head>
<body>
<div th:insert="layout/navbar::navbar"></div>
<main>
    <header>
        <h1>Prestataires</h1>
        <a th:if="${peutGererReferentiels}" th:href="@{/prestataires/ajout}">Ajouter un prestataire</a>
    </header>

    <table>
            <thead>
            <tr>
                <th scope="col">Identifiant</th>
                <th scope="col">Nom</th>
                <th scope="col">Contact</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prestataires}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nom}">Nom</td>
                <td th:text="${p.contact}">contact@exemple.fr</td>
            </tr>
            <tr th:if="${#lists.isEmpty(prestataires)}">
                <td colspan="3">Aucun prestataire pour le moment.</td>
            </tr>
            </tbody>
    </table>
</main>
<div th:insert="layout/footer::footer"></div>
</body>
</html>
