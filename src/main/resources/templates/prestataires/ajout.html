<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter un prestataire</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/layout/navbar.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/common.css}">
</head>
<body>
    <div th:insert="layout/navbar::navbar"></div>
    <main>
    <h1>Ajouter un prestataire</h1>

    <form th:action="@{/prestataires/ajout/envoie}" th:object="${prestataire}" method="post">
        <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" th:field="*{nom}" required maxlength="100" autofocus>
        </div>

        <div>
            <label for="contact">Contact</label>
            <input type="text" id="contact" th:field="*{contact}" required maxlength="255">
            <span>Email, téléphone ou adresse</span>
        </div>

        <div>
            <button type="submit">Enregistrer le prestataire</button>
            <a th:href="@{/prestataires}">Annuler</a>
        </div>
    </form>
    </main>
    <div th:insert="layout/footer::footer"></div>
</body>
</html>
