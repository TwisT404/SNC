<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter une station</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/layout/navbar.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/common.css}">
</head>
<body>
    <div th:insert="layout/navbar::navbar"></div>
    <main>
    <h1>Ajouter une station</h1>

    <form th:action="@{/stations/ajout/envoie}" th:object="${station}" method="post">
        <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" th:field="*{nom}" required maxlength="100" autofocus>
        </div>

        <div>
            <button type="submit">Enregistrer la station</button>
            <a th:href="@{/stations}">Annuler</a>
        </div>
    </form>
    </main>
    <div th:insert="layout/footer::footer"></div>
</body>
</html>
