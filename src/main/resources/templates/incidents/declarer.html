<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déclarer un incident</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/layout/navbar.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/common.css}">
    <link rel="stylesheet" th:href="@{/styles/incidents/declarer.css}">
</head>
<body>
    <div th:insert="layout/navbar::navbar"></div>
    <main>
        <h1>Déclarer un incident :</h1>
        <a th:href="@{/incidents/dashboard}">Retour</a>
        <form th:action="@{/incidents/declarer/envoie}" th:object="${incident}" method="post">
            <div>
                <label>Equipement concerné :</label>
                <select name="equipement_concern" id="equipement_concern" th:field="*{idEquipement}">
                    <option th:each="equipement : ${equipements}"
                            th:value="${equipement.id}"
                            th:text="${equipement.libelle}">
                    </option>
                </select>
            </div>
            <div>
                <label>Description :</label>
                <textarea name="description" id="description" cols="30" rows="10" th:field="*{description}"></textarea>
            </div>
            <button type="submit">Ajouter l'incident</button>
        </form>
    </main>
    <div th:insert="layout/footer::footer"></div>
</body>
</html>
