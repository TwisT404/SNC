<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détails de l'Équipement</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/styles/layout/navbar.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/footer.css}">
    <link rel="stylesheet" th:href="@{/styles/layout/common.css}">
</head>
<body>
    <div th:insert="layout/navbar::navbar"></div>
    <main>
        <h1>Equipement : <span th:text="${equipement.referenceUnique}"></span></h1>
        <div>
            <h2>Détails sur l'équipement :</h2>
            <div>
                <h3>Libellé :</h3>
                <p th:text="${equipement.libelle}"></p>
            </div>
            <div>
                <h3>État de fonctionnement :</h3>
                <p th:text="${equipement.etatFonctionnement}"></p>
            </div>
            <div>
                <h3>Type :</h3>
                <p th:text="${equipement.type}"></p>
            </div>
        </div>
        <div>
            <h2>Incidents concernant l'équipement :</h2>
            <div>
                <div th:each="incident : ${incidents}">
                    <p th:text="${incident.description}"></p>
                    <p th:text="${incident.statut}"></p>
                    <p th:text="${incident.dateOuverture}"></p>
                </div>
            </div>
        </div>
    </main>
    <div th:insert="layout/footer::footer"></div>
</body>
</html>
