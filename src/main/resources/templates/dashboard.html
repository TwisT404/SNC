<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <main>
        <div id="notif_modif">
            <p th:if="${ajout_incident == true}">L'incident a bien été ajouté!</p>
            <p th:if="${ajout_incident == false}" >"Erreur → Problème lors de l'ajout de l'incident !</p>
        </div>
        <h1>Tableau de bord des incidents non résolus :</h1>
        <section>
            <div>
                <a th:href="@{/incidents/declarer}">Déclarer un incident</a>
                <a>Voir l'historique des incidents</a>
            </div>
        </section>
        <section>
            <h2>Liste des incidents en cours de résolutions :</h2>
            <article>
                <div th:each="incident : ${incidents_non_resolus}">
                    <span th:text="${incident.description}"></span>
                    <p>Date ouverture : <span th:text="${#temporals.format(incident.dateOuverture.atZone(T(java.time.ZoneId).of('Europe/Paris')), 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p>Statut :<span th:text="${incident.statut}"></span></p>
                    <a>Consulter l'incident</a>
                </div>
            </article>
        </section>
    </main>


</body>
</html>
